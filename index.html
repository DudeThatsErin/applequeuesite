<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple Queue</title>
<meta name="description" content="Apple Queue is a browser extension plus your own private backend. Capture notes, reminders, and events from any page; an iOS Shortcut drops them straight into Apple's apps.">
<meta property="og:title" content="Apple Queue">
<meta property="og:description" content="Capture to Apple Notes, Reminders, and Calendar from your browser, through a backend you own.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://applequeue.erinskidds.com/">
<link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
  // Applied before first paint so the theme doesn't flash. React picks the
  // same value up on mount.
  (function () {
    try {
      var t = localStorage.getItem('aq-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
      else if (window.matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
